version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fiec_backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Corporate AI & Document Management Platform
      - SECRET_KEY=fiec-sesi-senior-fullstack-secret-key-super-secure-2026
      - DATABASE_URL=sqlite:///./corporate.db
    volumes:
      - ./backend/corporate.db:/app/corporate.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fiec_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

